<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuSign | Connection Check</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg-page: #ffffff;
    --bg-card: #fafafa;
    --bg-card-hover: #f4f5f7;
    --border-subtle: #e5e7eb;
    --border-strong: #d1d5db;
    --accent-orange: #f48120;
    --accent-green: #16a34a;
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-muted: #71717a;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
}

.page-shell {
    width: 100%;
    max-width: 560px;
}

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
}

.brand {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
}

.brand span {
    color: var(--text-muted);
    font-weight: 500;
}

.status-pill {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: #f4f4f5;
    border: 1px solid var(--border-subtle);
    padding: 4px 10px;
    border-radius: 999px;
}

h1 {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 1.25;
    margin-bottom: 12px;
    color: var(--text-primary);
}

.description {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-secondary);
    margin-bottom: 28px;
}

/* Verification Box (#searchLink) */
.verify-box {
    width: 100%;
    max-width: 340px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.verify-box:hover {
    background-color: var(--bg-card-hover);
    border-color: #9ca3af;
}

.verify-box:focus-visible {
    outline: 2px solid var(--accent-orange);
    outline-offset: 2px;
}

.verify-box.verified {
    background-color: #f0fdf4;
    border-color: #86efac;
}

.verify-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.check-slot {
    position: relative;
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.verify-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid #a1a1aa;
    border-radius: 5px;
    background-color: #ffffff;
    cursor: pointer;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.verify-checkbox:checked {
    background-color: var(--accent-green);
    border-color: var(--accent-green);
}

.verify-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 3px;
    width: 5px;
    height: 10px;
    border: solid #ffffff;
    border-width: 0 2.2px 2.2px 0;
    transform: rotate(42deg);
}

.check-slot.loading .verify-checkbox {
    opacity: 0;
    pointer-events: none;
}

.spinner {
    display: none;
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2.5px solid #e4e4e7;
    border-top-color: var(--accent-orange);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
}

.check-slot.loading .spinner {
    display: block;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.verify-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
}

.verify-box.verified .verify-label {
    color: #166534;
    font-weight: 600;
}

.verify-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    flex-shrink: 0;
}

.provider-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-primary);
}

.provider-badge svg {
    width: 22px;
    height: 12px;
    fill: var(--accent-orange);
}

.provider-meta {
    font-size: 10px;
    color: var(--text-muted);
}

.footer {
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--border-subtle);
    font-size: 12px;
    line-height: 1.8;
    color: var(--text-muted);
}

.footer strong {
    color: var(--text-secondary);
    font-weight: 600;
}

.footer a {
    color: var(--text-secondary);
    text-decoration: none;
}

.footer a:hover {
    text-decoration: underline;
}

@media (max-width: 480px) {
    h1 {
        font-size: 24px;
    }

    .verify-box {
        max-width: 100%;
    }
}
</style>
</head>
<body>

<main class="page-shell">
    <header class="top-bar">

    <footer class="footer">
        <strong>DocuSign</strong> · Ray ID: <span id="ray-id">256d2ba1ac6fc1d4</span><br>

</main>
